<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Background biru ungu">
  <defs>
    <radialGradient id="purpleGlow" cx="22%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#6d28d9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="88%" cy="92%" r="75%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.50" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="midGlow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e" stop-opacity="0" />
      <stop offset="62%" stop-color="#0a0f1e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="fadeSides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0f1e" stop-opacity="0.55" />
      <stop offset="20%" stop-color="#0a0f1e" stop-opacity="0" />
      <stop offset="80%" stop-color="#0a0f1e" stop-opacity="0" />
      <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0.55" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#0a0f1e" />
  <rect width="1920" height="1080" fill="url(#purpleGlow)" />
  <rect width="1920" height="1080" fill="url(#blueGlow)" />
  <rect width="1920" height="1080" fill="url(#midGlow)" />
  <rect width="1920" height="1080" fill="url(#grid)" />

  <!-- abstract geometric outlines -->
  <g stroke="#a5b4fc" stroke-opacity="0.18" fill="none" stroke-width="1.5">
    <circle cx="320" cy="220" r="140" />
    <circle cx="320" cy="220" r="92" />
    <polygon points="1580,160 1700,360 1460,360" />
    <rect x="1500" y="720" width="120" height="120" transform="rotate(20 1560 780)" />
  </g>

  <!-- diagonal wave -->
  <path
    d="M-50 840 C 320 740 540 980 900 860 C 1240 750 1480 940 1980 800"
    fill="none"
    stroke="#22d3ee"
    stroke-opacity="0.16"
    stroke-width="2"
  />
  <path
    d="M-50 920 C 360 820 560 1040 940 920 C 1280 810 1520 1000 1980 880"
    fill="none"
    stroke="#8b5cf6"
    stroke-opacity="0.16"
    stroke-width="2"
  />

  <!-- particles -->
  <g fill="#ffffff">
    <circle cx="180" cy="120" r="2" opacity="0.5" />
    <circle cx="460" cy="300" r="1.6" opacity="0.4" />
    <circle cx="760" cy="160" r="2.2" opacity="0.45" />
    <circle cx="980" cy="320" r="1.6" opacity="0.35" />
    <circle cx="1240" cy="120" r="2" opacity="0.5" />
    <circle cx="1420" cy="300" r="1.6" opacity="0.4" />
    <circle cx="1660" cy="180" r="2.2" opacity="0.45" />
    <circle cx="260" cy="560" r="1.6" opacity="0.35" />
    <circle cx="600" cy="640" r="2" opacity="0.4" />
    <circle cx="1100" cy="600" r="1.6" opacity="0.35" />
    <circle cx="1540" cy="560" r="2.2" opacity="0.45" />
    <circle cx="820" cy="460" r="1.6" opacity="0.3" />
    <circle cx="1380" cy="460" r="1.6" opacity="0.3" />
  </g>

  <!-- readability overlays -->
  <rect width="1920" height="1080" fill="url(#fadeSides)" />
  <rect width="1920" height="1080" fill="url(#fadeBottom)" />
</svg>
